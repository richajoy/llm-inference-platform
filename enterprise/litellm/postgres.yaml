# PostgreSQL deployment for LiteLLM key/team storage
# Provides persistent storage for API keys, teams, budgets, and usage data
---
apiVersion: v1
kind: Namespace
metadata:
  name: enterprise
  labels:
    app.kubernetes.io/part-of: llm-inference-platform
---
apiVersion: v1
kind: Secret
metadata:
  name: postgres-credentials
  namespace: enterprise
  labels:
    app.kubernetes.io/name: postgres
    app.kubernetes.io/component: database
    app.kubernetes.io/part-of: litellm
type: Opaque
stringData:
  POSTGRES_PASSWORD: "changeme-use-sealed-secrets-in-prod"
  POSTGRES_USER: "litellm"
  POSTGRES_DB: "litellm"
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: postgres-init
  namespace: enterprise
  labels:
    app.kubernetes.io/name: postgres
    app.kubernetes.io/component: database
    app.kubernetes.io/part-of: litellm
data:
  init.sql: |
    -- LiteLLM manages its own schema migrations on startup.
    -- This init script ensures the database is ready and sets conservative defaults.

    -- Enable pg_trgm for fast text search on key aliases
    CREATE EXTENSION IF NOT EXISTS pg_trgm;

    -- Set default statement timeout to prevent runaway queries
    ALTER DATABASE litellm SET statement_timeout = '30s';

    -- Create a read-only role for monitoring/dashboards
    DO $$
    BEGIN
      IF NOT EXISTS (SELECT FROM pg_catalog.pg_roles WHERE rolname = 'litellm_readonly') THEN
        CREATE ROLE litellm_readonly WITH LOGIN PASSWORD 'readonly-changeme';
      END IF;
    END
    $$;

    GRANT CONNECT ON DATABASE litellm TO litellm_readonly;
    -- LiteLLM will create tables; grant SELECT after they exist
    ALTER DEFAULT PRIVILEGES IN SCHEMA public GRANT SELECT ON TABLES TO litellm_readonly;
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: postgres-data
  namespace: enterprise
  labels:
    app.kubernetes.io/name: postgres
    app.kubernetes.io/component: database
    app.kubernetes.io/part-of: litellm
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 10Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: postgres
  namespace: enterprise
  labels:
    app.kubernetes.io/name: postgres
    app.kubernetes.io/component: database
    app.kubernetes.io/part-of: litellm
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: postgres
      app.kubernetes.io/component: database
  template:
    metadata:
      labels:
        app.kubernetes.io/name: postgres
        app.kubernetes.io/component: database
        app.kubernetes.io/part-of: litellm
    spec:
      containers:
        - name: postgres
          image: postgres:16-alpine
          ports:
            - name: postgres
              containerPort: 5432
              protocol: TCP
          env:
            - name: POSTGRES_DB
              valueFrom:
                secretKeyRef:
                  name: postgres-credentials
                  key: POSTGRES_DB
            - name: POSTGRES_USER
              valueFrom:
                secretKeyRef:
                  name: postgres-credentials
                  key: POSTGRES_USER
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: postgres-credentials
                  key: POSTGRES_PASSWORD
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
            - name: init-scripts
              mountPath: /docker-entrypoint-initdb.d
              readOnly: true
          resources:
            requests:
              cpu: 250m
              memory: 256Mi
            limits:
              cpu: "1"
              memory: 512Mi
          readinessProbe:
            exec:
              command:
                - pg_isready
                - -U
                - litellm
                - -d
                - litellm
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          livenessProbe:
            exec:
              command:
                - pg_isready
                - -U
                - litellm
                - -d
                - litellm
            initialDelaySeconds: 30
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 3
          securityContext:
            runAsUser: 999
            runAsGroup: 999
            allowPrivilegeEscalation: false
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: postgres-data
        - name: init-scripts
          configMap:
            name: postgres-init
      terminationGracePeriodSeconds: 60
---
apiVersion: v1
kind: Service
metadata:
  name: postgres
  namespace: enterprise
  labels:
    app.kubernetes.io/name: postgres
    app.kubernetes.io/component: database
    app.kubernetes.io/part-of: litellm
spec:
  type: ClusterIP
  ports:
    - name: postgres
      port: 5432
      targetPort: postgres
      protocol: TCP
  selector:
    app.kubernetes.io/name: postgres
    app.kubernetes.io/component: database
