# NeMo Guardrails Server Deployment
# Deep safety layer using LLM-based content analysis
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: nemo-guardrails
  namespace: enterprise
  labels:
    app.kubernetes.io/name: nemo-guardrails
    app.kubernetes.io/component: guardrails
    app.kubernetes.io/part-of: safety-layer
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: nemo-guardrails
      app.kubernetes.io/component: guardrails
  template:
    metadata:
      labels:
        app.kubernetes.io/name: nemo-guardrails
        app.kubernetes.io/component: guardrails
        app.kubernetes.io/part-of: safety-layer
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8090"
    spec:
      containers:
        - name: nemo-guardrails
          image: nvcr.io/nvidia/nemo-guardrails:0.11.0
          args:
            - nemoguardrails
            - server
            - --config
            - /config
            - --port
            - "8090"
          ports:
            - name: http
              containerPort: 8090
              protocol: TCP
          env:
            - name: OPENAI_API_BASE
              value: "http://vllm-70b-tp4.inference.svc.cluster.local:8000/v1"
            - name: OPENAI_API_KEY
              value: "not-needed-for-local-vllm"
          volumeMounts:
            - name: config
              mountPath: /config
              readOnly: true
          resources:
            requests:
              cpu: 500m
              memory: 1Gi
            limits:
              cpu: "1"
              memory: 2Gi
          readinessProbe:
            httpGet:
              path: /v1/rails/configs
              port: http
            initialDelaySeconds: 15
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /v1/rails/configs
              port: http
            initialDelaySeconds: 30
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 3
          securityContext:
            allowPrivilegeEscalation: false
      volumes:
        - name: config
          configMap:
            name: nemo-guardrails-config
      terminationGracePeriodSeconds: 30
---
apiVersion: v1
kind: Service
metadata:
  name: nemo-guardrails
  namespace: enterprise
  labels:
    app.kubernetes.io/name: nemo-guardrails
    app.kubernetes.io/component: guardrails
    app.kubernetes.io/part-of: safety-layer
spec:
  type: ClusterIP
  ports:
    - name: http
      port: 8090
      targetPort: http
      protocol: TCP
  selector:
    app.kubernetes.io/name: nemo-guardrails
    app.kubernetes.io/component: guardrails
