# LLM Guard API Server Deployment
# Fast, model-based input/output scanning for content safety
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: llm-guard
  namespace: enterprise
  labels:
    app.kubernetes.io/name: llm-guard
    app.kubernetes.io/component: guardrails
    app.kubernetes.io/part-of: safety-layer
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: llm-guard
      app.kubernetes.io/component: guardrails
  template:
    metadata:
      labels:
        app.kubernetes.io/name: llm-guard
        app.kubernetes.io/component: guardrails
        app.kubernetes.io/part-of: safety-layer
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8060"
    spec:
      containers:
        - name: llm-guard
          image: laiyer/llm-guard-api:latest
          ports:
            - name: http
              containerPort: 8060
              protocol: TCP
          env:
            - name: LOG_LEVEL
              value: "INFO"
            - name: SCAN_FAIL_FAST
              value: "false"
            - name: SCAN_PROMPT_TIMEOUT
              value: "10"
            - name: SCAN_OUTPUT_TIMEOUT
              value: "10"
          volumeMounts:
            - name: config
              mountPath: /app/config
              readOnly: true
          resources:
            requests:
              cpu: 500m
              memory: 1Gi
            limits:
              cpu: "2"
              memory: 2Gi
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 60
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 3
          securityContext:
            allowPrivilegeEscalation: false
      volumes:
        - name: config
          configMap:
            name: llm-guard-config
      terminationGracePeriodSeconds: 30
---
apiVersion: v1
kind: Service
metadata:
  name: llm-guard
  namespace: enterprise
  labels:
    app.kubernetes.io/name: llm-guard
    app.kubernetes.io/component: guardrails
    app.kubernetes.io/part-of: safety-layer
spec:
  type: ClusterIP
  ports:
    - name: http
      port: 8060
      targetPort: http
      protocol: TCP
  selector:
    app.kubernetes.io/name: llm-guard
    app.kubernetes.io/component: guardrails
