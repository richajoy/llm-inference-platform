# Gang scheduling for a multi-pod tensor-parallel deployment (vLLM with Ray,
# or llm-d/Dynamo prefill+decode pairs): all members must be placed together
# or not at all, so a half-placed TP group never holds GPUs while waiting for
# the rest. KAI's podgrouper creates a PodGroup per workload automatically;
# this file shows the explicit form for a two-pod P/D pair that must co-start.
apiVersion: scheduling.run.ai/v2alpha2
kind: PodGroup
metadata:
  name: llama-70b-pd-pair
  namespace: inference
spec:
  queue: inference-prod
  minMember: 2
  priorityClassName: inference
---
apiVersion: v1
kind: Pod
metadata:
  name: llama-70b-prefill
  namespace: inference
  labels:
    kai.scheduler/queue: inference-prod
    pod-group-name: llama-70b-pd-pair
  annotations:
    kai.scheduler/skip-podgrouper: "true"
spec:
  schedulerName: kai-scheduler
  containers:
    - name: vllm
      image: vllm/vllm-openai:v0.11.0
      args: ["--model=meta-llama/Llama-3.3-70B-Instruct", "--tensor-parallel-size=4", "--kv-transfer-config={\"kv_connector\":\"NixlConnector\",\"kv_role\":\"kv_producer\"}"]
      resources:
        limits:
          nvidia.com/gpu: 4
---
apiVersion: v1
kind: Pod
metadata:
  name: llama-70b-decode
  namespace: inference
  labels:
    kai.scheduler/queue: inference-prod
    pod-group-name: llama-70b-pd-pair
  annotations:
    kai.scheduler/skip-podgrouper: "true"
spec:
  schedulerName: kai-scheduler
  containers:
    - name: vllm
      image: vllm/vllm-openai:v0.11.0
      args: ["--model=meta-llama/Llama-3.3-70B-Instruct", "--tensor-parallel-size=4", "--kv-transfer-config={\"kv_connector\":\"NixlConnector\",\"kv_role\":\"kv_consumer\"}"]
      resources:
        limits:
          nvidia.com/gpu: 4
