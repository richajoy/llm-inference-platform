# KEDA ScaledObjects for Llama 3.3 70B Disaggregated Prefill/Decode
#
# Disaggregated P/D splits inference into two pools with different
# performance characteristics. Each pool gets its own ScaledObject
# with metrics tuned to its specific bottleneck:
#   - Prefill: compute-bound → scale on TTFT and queue depth
#   - Decode:  memory-bound  → scale on ITL/TPOT and KV-cache usage
#
# For more sophisticated P/D autoscaling, see the llm-d VariantAutoscaler
# at inference/llm-d/autoscaler/variant-autoscaler.yaml
---
# ── Prefill Pool ScaledObject ───────────────────────────────────────────────
# Prefill is compute-bound: scaling is triggered by TTFT SLO breaches
# and queue depth. KV-cache is less relevant (prefill generates, not consumes).
apiVersion: keda.sh/v1alpha1
kind: ScaledObject
metadata:
  name: vllm-70b-prefill-keda
  namespace: inference
  labels:
    app: vllm-70b-prefill
    role: prefill
    app.kubernetes.io/component: autoscaler
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: vllm-70b-prefill

  minReplicaCount: 1
  maxReplicaCount: 4
  pollingInterval: 10       # Faster polling — prefill latency is user-facing
  cooldownPeriod: 180

  fallback:
    failureThreshold: 5
    replicas: 1

  advanced:
    horizontalPodAutoscalerConfig:
      behavior:
        scaleUp:
          stabilizationWindowSeconds: 30
          policies:
            - type: Pods
              value: 2
              periodSeconds: 60     # Aggressive: prefill directly impacts TTFT
        scaleDown:
          stabilizationWindowSeconds: 300
          policies:
            - type: Pods
              value: 1
              periodSeconds: 300

  triggers:
    # TTFT is THE metric for prefill quality
    - type: prometheus
      metadata:
        serverAddress: http://kube-prometheus-stack-prometheus.monitoring:9090
        query: |
          histogram_quantile(0.99,
            sum(rate(vllm:time_to_first_token_seconds_bucket{namespace="inference",pod=~"vllm-70b-prefill.*"}[3m]))
            by (le)
          )
        threshold: "2"
        activationThreshold: "0.3"
        metricName: prefill_ttft_p99
      metricType: AverageValue

    # Queue depth on prefill pool
    - type: prometheus
      metadata:
        serverAddress: http://kube-prometheus-stack-prometheus.monitoring:9090
        query: |
          sum(vllm:num_requests_waiting{namespace="inference",pod=~"vllm-70b-prefill.*"})
        threshold: "5"
        activationThreshold: "1"
        metricName: prefill_queue
      metricType: AverageValue

---
# ── Decode Pool ScaledObject ────────────────────────────────────────────────
# Decode is memory-bandwidth-bound: scaling is triggered by ITL/TPOT
# degradation and KV-cache pressure. Queue depth matters less because
# decode is a continuous streaming operation.
apiVersion: keda.sh/v1alpha1
kind: ScaledObject
metadata:
  name: vllm-70b-decode-keda
  namespace: inference
  labels:
    app: vllm-70b-decode
    role: decode
    app.kubernetes.io/component: autoscaler
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: vllm-70b-decode

  minReplicaCount: 1
  maxReplicaCount: 8       # Decode needs more replicas (memory-bound)
  pollingInterval: 15
  cooldownPeriod: 300

  fallback:
    failureThreshold: 5
    replicas: 2              # Higher fallback — decode is the bottleneck

  advanced:
    horizontalPodAutoscalerConfig:
      behavior:
        scaleUp:
          stabilizationWindowSeconds: 60
          policies:
            - type: Pods
              value: 4                       # Aggressive for throughput
              periodSeconds: 60
            - type: Percent
              value: 100                     # Allow doubling
              periodSeconds: 60
          selectPolicy: Max
        scaleDown:
          stabilizationWindowSeconds: 600   # Conservative: 10 min
          policies:
            - type: Pods
              value: 1
              periodSeconds: 300

  triggers:
    # ITL/TPOT is THE metric for decode quality (streaming experience)
    - type: prometheus
      metadata:
        serverAddress: http://kube-prometheus-stack-prometheus.monitoring:9090
        query: |
          histogram_quantile(0.99,
            sum(rate(vllm:inter_token_latency_seconds_bucket{namespace="inference",pod=~"vllm-70b-decode.*"}[5m]) or rate(vllm:time_per_output_token_seconds_bucket{namespace="inference",pod=~"vllm-70b-decode.*"}[5m]))
            by (le)
          )
        threshold: "0.05"
        activationThreshold: "0.02"
        metricName: decode_itl_p99
      metricType: AverageValue

    # KV-cache is critical for decode — approaching 95% causes preemptions
    - type: prometheus
      metadata:
        serverAddress: http://kube-prometheus-stack-prometheus.monitoring:9090
        query: |
          avg(vllm:kv_cache_usage_perc{namespace="inference",pod=~"vllm-70b-decode.*"} or vllm:gpu_cache_usage_perc{namespace="inference",pod=~"vllm-70b-decode.*"})
        threshold: "0.80"
        activationThreshold: "0.5"
        metricName: decode_kv_cache
      metricType: AverageValue

    # Running requests (batch size) — directly affects memory bandwidth pressure
    - type: prometheus
      metadata:
        serverAddress: http://kube-prometheus-stack-prometheus.monitoring:9090
        query: |
          avg(vllm:num_requests_running{namespace="inference",pod=~"vllm-70b-decode.*"})
        threshold: "64"
        activationThreshold: "16"
        metricName: decode_batch
      metricType: AverageValue
