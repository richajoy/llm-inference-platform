# LMCache configuration for KV-cache offloading and disaggregated P/D
# Mount this ConfigMap as a file and reference via LMCACHE_CONFIG_FILE env var
apiVersion: v1
kind: ConfigMap
metadata:
  name: lmcache-config
  namespace: inference
  labels:
    app: vllm
    app.kubernetes.io/name: lmcache-config
    app.kubernetes.io/component: inference-engine
    app.kubernetes.io/part-of: llm-inference
data:
  # LMCache config for KV-cache CPU/disk offloading (single-node mode)
  lmcache.yaml: |
    chunk_size: 256
    local_cpu:
      enable: true
      max_size_gb: 64
    local_disk:
      enable: true
      path: /workspace/kv-cache
      max_size_gb: 200
    remote:
      enable: false
      # Toggle to true for disaggregated P/D with remote KV transfer
      # url: "lm://prefill-svc:8100"
      # serde: "naive"

  # LMCache config for prefill node in disaggregated P/D
  lmcache-prefiller.yaml: |
    chunk_size: 256
    local_cpu: false
    enable_nixl: true
    nixl_role: "sender"
    nixl_peer_host: "vllm-70b-decode"
    nixl_peer_port: 55555
    nixl_buffer_size: 1073741824
    nixl_buffer_device: "cuda"

  # LMCache config for decode node in disaggregated P/D
  lmcache-decoder.yaml: |
    chunk_size: 256
    local_cpu: false
    enable_nixl: true
    nixl_role: "receiver"
    nixl_peer_host: "vllm-70b-prefill"
    nixl_peer_port: 55555
    nixl_buffer_size: 1073741824
    nixl_buffer_device: "cuda"
