# Kustomize base for vLLM deployments
# Profile overlays reference this base and apply patches
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: inference

commonLabels:
  app.kubernetes.io/managed-by: kustomize
  app.kubernetes.io/part-of: llm-inference

resources:
  - deployment.yaml
  - service.yaml
