# Base vLLM ClusterIP service
# Exposes the OpenAI-compatible API on port 8000
apiVersion: v1
kind: Service
metadata:
  name: vllm
  namespace: inference
  labels:
    app: vllm
    app.kubernetes.io/name: vllm
    app.kubernetes.io/component: inference-engine
    app.kubernetes.io/part-of: llm-inference
spec:
  type: ClusterIP
  selector:
    app: vllm
  ports:
    - name: http
      port: 8000
      targetPort: http
      protocol: TCP
