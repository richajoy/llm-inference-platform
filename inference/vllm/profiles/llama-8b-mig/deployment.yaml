# Kustomize patch: Llama 3.1 8B on MIG 1g.10gb slice
# Optimized for low-latency single-GPU inference on a MIG partition
apiVersion: apps/v1
kind: Deployment
metadata:
  name: vllm-8b-mig
  namespace: inference
spec:
  selector:
    matchLabels:
      app: vllm-8b-mig
  template:
    metadata:
      labels:
        app: vllm-8b-mig
        model: llama-3-1-8b-instruct
        profile: mig-1g-10gb
    spec:
      containers:
        - name: vllm
          args:
            - "--host"
            - "0.0.0.0"
            - "--port"
            - "8000"
            - "--model"
            - "/models/meta-llama--Llama-3.1-8B-Instruct"
            - "--served-model-name"
            - "meta-llama/Llama-3.1-8B-Instruct"
            - "--gpu-memory-utilization"
            - "0.90"
            - "--max-model-len"
            - "4096"
            - "--max-num-seqs"
            - "64"
            - "--enable-prefix-caching"
            - "--dtype"
            - "auto"
          resources:
            requests:
              cpu: "2"
              memory: 12Gi
              nvidia.com/gpu: 1
            limits:
              cpu: "4"
              memory: 16Gi
              nvidia.com/gpu: 1
          volumeMounts:
            - name: model-weights
              mountPath: /models
              readOnly: true
            - name: dshm
              mountPath: /dev/shm
      # Prefer scheduling on nodes with MIG slices
      nodeSelector:
        nvidia.com/gpu.product: "NVIDIA-H100-80GB-HBM3-MIG-1g.10gb"
      tolerations:
        - key: nvidia.com/gpu
          operator: Exists
          effect: NoSchedule
      volumes:
        - name: model-weights
          persistentVolumeClaim:
            claimName: model-weights
        - name: dshm
          emptyDir:
            medium: Memory
            sizeLimit: 2Gi
