# Kustomize overlay: Llama 3.1 8B on MIG slice
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: inference

resources:
  - ../../base

patches:
  - path: deployment.yaml
    target:
      kind: Deployment
      name: vllm
  - target:
      kind: Deployment
      name: vllm
    patch: |
      - op: replace
        path: /metadata/name
        value: vllm-8b-mig
      - op: replace
        path: /spec/selector/matchLabels/app
        value: vllm-8b-mig
      - op: replace
        path: /spec/template/metadata/labels/app
        value: vllm-8b-mig
  - target:
      kind: Service
      name: vllm
    patch: |
      - op: replace
        path: /metadata/name
        value: vllm-8b-mig
      - op: replace
        path: /spec/selector/app
        value: vllm-8b-mig

commonLabels:
  profile: llama-8b-mig
