# Kustomize overlay: Llama 3.3 70B + EAGLE3 speculative decoding
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: inference

resources:
  - ../../base

patches:
  - path: deployment.yaml
    target:
      kind: Deployment
      name: vllm
  - target:
      kind: Deployment
      name: vllm
    patch: |
      - op: replace
        path: /metadata/name
        value: vllm-70b-eagle3
      - op: replace
        path: /spec/selector/matchLabels/app
        value: vllm-70b-eagle3
      - op: replace
        path: /spec/template/metadata/labels/app
        value: vllm-70b-eagle3
  - target:
      kind: Service
      name: vllm
    patch: |
      - op: replace
        path: /metadata/name
        value: vllm-70b-eagle3
      - op: replace
        path: /spec/selector/app
        value: vllm-70b-eagle3

commonLabels:
  profile: llama-70b-eagle3
