# InferenceModel CRDs: Map client-facing model names to backend vLLM deployments
# These are the logical models exposed through the Gateway API

# Llama 3.1 8B - lightweight, cost-efficient
apiVersion: inference.networking.x-k8s.io/v1alpha2
kind: InferenceModel
metadata:
  name: llama-3-1-8b-instruct
  namespace: inference
  labels:
    app.kubernetes.io/name: llama-3-1-8b-instruct
    app.kubernetes.io/component: inference-model
    app.kubernetes.io/part-of: llm-inference
spec:
  modelName: "meta-llama/Llama-3.1-8B-Instruct"
  criticality: Standard
  poolRef:
    name: vllm-pool
  targetModels:
    - name: "meta-llama/Llama-3.1-8B-Instruct"
      weight: 100
---
